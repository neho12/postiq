<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בונה האתרים</title>
<meta name="description" content="מספרים על העסק בשיחה חופשית, ומקבלים אתר מעוצב בעברית. אחר כך משנים ומוסיפים תוכן פשוט בכתיבה.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0B0A09;--panel:#141210;--panel2:#1D1A16;--line:rgba(255,255,255,.09);--text:#F4F3EA;--muted:#9C9885;--acc:#E09A60;--acc2:#C17A44;--me:#2A241D}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Heebo",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:440px 1fr;height:100svh}
  .chat{display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .top b{font-size:18px;font-weight:900;letter-spacing:-.01em}
  .top b em{font-style:normal;color:var(--acc)}
  .tools{display:flex;gap:6px}
  .ghost{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
  .ghost:hover{color:var(--text);border-color:var(--muted)}
  .log{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:12px;min-height:0}
  .msg{max-width:88%;padding:11px 15px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg.bot{align-self:flex-start;background:var(--panel2);border-top-right-radius:6px}
  .msg.me{align-self:flex-end;background:var(--me);border:1px solid rgba(224,154,96,.25);border-top-left-radius:6px}
  .msg.note{align-self:center;background:none;color:var(--muted);font-size:13px;padding:2px 8px}
  .msg.err{align-self:center;background:rgba(220,80,80,.12);border:1px solid rgba(220,80,80,.35);font-size:14px}
  .typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;background:var(--panel2);border-radius:18px;border-top-right-radius:6px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .pay{align-self:stretch;padding:18px;border-radius:18px;background:linear-gradient(135deg,rgba(224,154,96,.18),rgba(193,122,68,.06));border:1px solid rgba(224,154,96,.35)}
  .pay h3{margin:0 0 6px;font-size:18px}
  .pay p{margin:0 0 14px;color:var(--muted);font-size:14px}
  .btn{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:999px;padding:12px 20px;cursor:pointer;background:var(--acc);color:#14110D;transition:transform .2s}
  .btn:hover{transform:translateY(-2px)}
  .btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
  .photos{display:flex;gap:6px;padding:0 18px 8px;overflow-x:auto}
  .photos:empty{display:none}
  .photos div{position:relative;flex:none}
  .photos img{width:46px;height:46px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
  .photos button{position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#000;color:#fff;font-size:12px;line-height:20px;cursor:pointer;padding:0}
  .composer{display:flex;align-items:flex-end;gap:8px;padding:12px 14px 16px;border-top:1px solid var(--line)}
  .composer textarea{flex:1;resize:none;font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:11px 14px;max-height:160px;outline:none}
  .composer textarea:focus{border-color:var(--acc)}
  .icon{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--text);display:grid;place-items:center;cursor:pointer;font-size:18px}
  .icon.send{background:var(--acc);color:#14110D;border-color:var(--acc);font-weight:900}
  .icon[disabled]{opacity:.45;cursor:not-allowed}
  .stage{display:flex;flex-direction:column;background:#050505;min-width:0;min-height:0}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  .dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#3a3631}
  .dev{display:flex;gap:6px}
  .dev button[aria-pressed="true"]{background:var(--acc);color:#14110D;border-color:var(--acc)}
  .frame{flex:1;display:grid;place-items:center;padding:18px;min-height:0;position:relative}
  iframe{width:100%;height:100%;border:0;border-radius:14px;background:#0E0D0B;box-shadow:0 30px 80px rgba(0,0,0,.6);transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .frame.mobile iframe{width:390px}
  .empty{position:absolute;inset:18px;display:grid;place-items:center;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px;padding:30px}
  .empty[hidden]{display:none}
  .empty b{display:block;font-size:22px;color:var(--text);margin-bottom:6px}
  .tabs{display:none}
  @media (max-width:900px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .tabs{display:flex;gap:6px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
    .tabs button{flex:1}
    .tabs button[aria-pressed="true"]{background:var(--acc);color:#14110D;border-color:var(--acc)}
    .chat,.stage{grid-row:2;grid-column:1;min-height:0}
    .app[data-view="chat"] .stage{display:none}
    .app[data-view="site"] .chat{display:none}
    .dev{display:none}
    .frame{padding:10px}
  }
</style>
</head>
<body>
<div class="app" id="app" data-view="chat">
  <div class="tabs" role="tablist">
    <button class="ghost" id="vChat" aria-pressed="true">שיחה</button>
    <button class="ghost" id="vSite" aria-pressed="false">האתר</button>
  </div>

  <section class="chat" aria-label="שיחה">
    <div class="top">
      <b>בונה <em>האתרים</em></b>
      <div class="tools">
        <button class="ghost" id="download" disabled>הורדת האתר</button>
        <button class="ghost" id="reset">התחלה מחדש</button>
      </div>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="photos" id="photos"></div>
    <form class="composer" id="form">
      <label class="icon" title="העלאת תמונות" aria-label="העלאת תמונות">📷<input type="file" id="files" accept="image/*" multiple hidden></label>
      <textarea id="input" rows="1" placeholder="כתבו כאן..." aria-label="ההודעה שלכם"></textarea>
      <button class="icon send" id="send" type="submit" aria-label="שליחה">↑</button>
    </form>
  </section>

  <main class="stage" aria-label="תצוגה מקדימה">
    <div class="bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="dev">
        <button class="ghost" id="dDesk" aria-pressed="true">מחשב</button>
        <button class="ghost" id="dMob" aria-pressed="false">נייד</button>
      </div>
    </div>
    <div class="frame" id="frame">
      <iframe id="preview" title="האתר שלכם" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
      <div class="empty" id="empty"><div><b>האתר שלכם יופיע כאן</b>ספרו בצ'אט על העסק, והוא ייבנה תוך כדי שיחה.</div></div>
    </div>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
